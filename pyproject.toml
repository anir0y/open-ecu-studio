[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-ecu-can-lab"
version = "0.1.0"
description = "Software-only synthetic ECU, ESC, CAN FD, and UDS research lab"
requires-python = ">=3.11"
dependencies = ["python-can==4.6.1"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx2==2.16.2", "fastapi==0.165.0", "unicorn==2.1.4", "pyelftools==0.32"]
ui = ["fastapi==0.165.0", "uvicorn[standard]==0.54.0", "unicorn==2.1.4", "pyelftools==0.32"]
desktop = ["pyinstaller==6.22.3"]

[project.scripts]
ecu-can-lab = "ecu_lab.demo:main"
ecu-can-ui = "ecu_lab.server:main"

[tool.setuptools.packages.find]
include = ["ecu_lab*", "firmware.reference_ecu"]

[tool.setuptools.package-data]
ecu_lab = ["ui_dist/**"]
"firmware.reference_ecu" = ["reference_ecu.resc", "build/reference_ecu.elf"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

